name: watcher-windows

# Builds the `prize-maps` CLI for Windows. The dev machine is Linux and
# the watcher links Win32 APIs (windows-rs via xcap/enigo, WebView2 via
# wry), so a real Windows runner is the practical way to produce a binary
# to test with.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "watcher/**"
      - ".github/workflows/watcher-windows.yml"
  push:
    tags:
      - "watcher-v*"
    branches:
      - main
    paths:
      - "watcher/**"
      - ".github/workflows/watcher-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: watcher
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            watcher/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('watcher/Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/prize-maps.exe dist/
          & dist/prize-maps.exe --version
          Compress-Archive -Path dist/prize-maps.exe -DestinationPath prize-maps-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prize-maps-windows-x64
          path: watcher/prize-maps-windows-x64.zip
          if-no-files-found: error

      - name: Release (on watcher-v* tag)
        if: startsWith(github.ref, 'refs/tags/watcher-v')
        uses: softprops/action-gh-release@v2
        with:
          files: watcher/prize-maps-windows-x64.zip
