name: watcher-macos

# Builds the `tcg-watcher` CLI for macOS. The dev machine is Linux and the
# watcher pulls in Apple frameworks (WebKit via wry, CoreGraphics via xcap/
# enigo, AppKit pasteboard via arboard), so a real macOS runner is the only
# practical way to produce a binary to test with.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "watcher/**"
      - ".github/workflows/watcher-macos.yml"
  push:
    tags:
      - "watcher-v*"
    branches:
      - main
    paths:
      - "watcher/**"
      - ".github/workflows/watcher-macos.yml"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: watcher
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, both macOS targets)
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            watcher/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('watcher/Cargo.lock') }}

      - name: Build (aarch64 + x86_64)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Make universal binary
        run: |
          mkdir -p dist
          lipo -create -output dist/tcg-watcher \
            target/aarch64-apple-darwin/release/tcg-watcher \
            target/x86_64-apple-darwin/release/tcg-watcher
          strip dist/tcg-watcher
          chmod +x dist/tcg-watcher
          lipo -info dist/tcg-watcher
          ./dist/tcg-watcher --version

      - name: Package
        run: |
          cp README.md dist/ 2>/dev/null || true
          tar -C dist -czf tcg-watcher-macos-universal.tar.gz tcg-watcher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcg-watcher-macos-universal
          path: watcher/tcg-watcher-macos-universal.tar.gz
          if-no-files-found: error

      - name: Release (on watcher-v* tag)
        if: startsWith(github.ref, 'refs/tags/watcher-v')
        uses: softprops/action-gh-release@v2
        with:
          files: watcher/tcg-watcher-macos-universal.tar.gz
