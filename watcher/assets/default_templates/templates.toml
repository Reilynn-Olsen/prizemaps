# Default button templates shipped in the binary — see the doc comment on
# `BUNDLED_TEMPLATES_TOML` in src/detector.rs. Captured once against a real
# PTCGL match (Linux/Wayland, KDE/CachyOS, 2880x1620 content rect). Regions
# and clicks are fractions of the content rect, which is what makes one
# capture reusable across displays. To regenerate: run `calibrate` against a
# clean match, then copy ~/.config/tcg-watcher/templates/* over these.

[[template]]
